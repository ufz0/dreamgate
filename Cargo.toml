[package]
name = "dreamgate"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
bcrypt = "0.19"
chrono = "0.4"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "rustls", "stream", "webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["chrono", "runtime-tokio", "sqlite"] }
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
