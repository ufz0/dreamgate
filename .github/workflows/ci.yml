name: ci

on:
  pull_request:

# The description check reads the pull request itself, so it needs read on pull requests as well as
# on the code. The scope is named pull-requests, not pull.
permissions:
  contents: read
  pull-requests: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Pinned so the build does not move on its own. This is the toolchain the code is formatted
      # with: a different rustfmt can wrap differently, so the check has to be the same one the
      # change was written with. It also cannot go below 1.94, which sqlx in the lockfile requires
      # (`rust-version` in Cargo.toml).
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99
      - run: cargo test --locked

  checklist:
    name: checklist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # gh reads GH_TOKEN, not GITHUB_TOKEN, so it has to be named here.
      - name: Checklist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          pr=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}")
          base=$(printf '%s' "$pr" | jq -r .base.ref)
          head=$(printf '%s' "$pr" | jq -r .head.ref)
          body=$(printf '%s' "$pr" | jq -r .body)

          # A change reaches dev through a pull request opened against dev. The only pull request that may
          # target main is the dev to main merge, which is the one a person makes by hand.
          if [ "$base" != "dev" ] && { [ "$base" != "main" ] || [ "$head" != "dev" ]; }; then
            echo "opened against $base, but a change reaches dev through a pull request and main only from dev"
            exit 1
          fi

          if ! printf '%s' "$body" | grep -q '^## Checklist'; then
            echo "no checklist section in the description"
            exit 1
          fi

          # The list is read from the copy of AGENTS.md in the pull request, because the checklist is
          # checked against the rules as they stand at the time of the pull request.
          items=$(grep -c '^- \[' AGENTS.md || true)
          answered=$(printf '%s' "$body" | grep '^- \[' | grep -cE '^- \[[xX]\]|n/a' || true)
          if [ "$answered" -lt "$items" ]; then
            echo "$answered of $items items answered; an item is ticked or marked n/a with a reason"
            exit 1
          fi

          review=$(printf '%s' "$body" | sed -n '/^## Review/,$p' | tail -n +2 | grep -v '^[[:space:]]*$' || true)
          if [ -z "$review" ]; then
            echo "the Review section is empty; state the findings, or that the change adds no behaviour"
            exit 1
          fi
